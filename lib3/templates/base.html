<!DOCTYPE html>
<html lang="hy" id="htmlRoot" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Գրադարան{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .navbar-brand { font-weight: 700; font-size: 1.3rem; }
  .overdue { color: #dc3545; font-weight: 600; }

  /* Մուգ թեմա */
  [data-bs-theme="dark"] body        { background: #212529; }
  [data-bs-theme="dark"] .card       { background: #2b3035; border-color: #444; }
  [data-bs-theme="dark"] .table      { --bs-table-bg: #2b3035; }
  [data-bs-theme="dark"] .form-control,
  [data-bs-theme="dark"] .form-select { background-color: #2b3035; color: #dee2e6; border-color: #555; }
  [data-bs-theme="dark"] .bg-white   { background-color: #2b3035 !important; }

  /* Թեմայի կոճակ */
  #themeToggle {
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    color: white;
  }
  #themeToggle:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">📚 Գրադարանային ցանց</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Կատալոգ</a></li>
        <li class="nav-item"><a class="nav-link" href="/readers/">Ընթերցողներ</a></li>
        <li class="nav-item"><a class="nav-link" href="/loans/">Տրամադրումներ</a></li>
        <li class="nav-item"><a class="nav-link" href="/loans/issue/">Տրամադրել գիրք</a></li>
        <li class="nav-item"><a class="nav-link" href="/books/import/">📥 Ներմուծել</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <!-- Թեմայի անջատիչ -->
        <button id="themeToggle" title="Թեմա">🌙</button>
        <a href="/admin/" class="btn btn-outline-light btn-sm">⚙ Ադմին</a>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const html = document.getElementById('htmlRoot');
  const btn  = document.getElementById('themeToggle');

  // Բեռնում ենք պահպանված թեման
  const saved = localStorage.getItem('theme') || 'light';
  html.setAttribute('data-bs-theme', saved);
  btn.textContent = saved === 'dark' ? '☀️' : '🌙';

  // Միացնել/անջատել կտտոցով
  btn.addEventListener('click', () => {
    const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
    btn.textContent = next === 'dark' ? '☀️' : '🌙';
  });
</script>
</body>
</html>
